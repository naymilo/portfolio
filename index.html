<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nenad M</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="nav">
    <a href="index.html" class="nav-logo" id="nav-logo"></a>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-bg">
      <canvas id="sphere" class="hero-sphere"></canvas>
    </div>
    <div class="hero-overlay" id="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-headline" id="hero-headline"></h1>
      <p class="hero-subtext" id="hero-subtext"></p>
    </div>
    <div class="hero-scroll-cue">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- WORK INDEX -->
  <section class="work" id="work">
    <div class="work-head">
      <h2 class="work-label">Selected work</h2>
      <span class="work-count" id="work-count"></span>
    </div>
    <div class="work-body">
      <ol class="work-list" id="work-list"></ol>
      <div class="work-preview" id="work-preview" aria-hidden="true"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer" id="footer"></footer>

  <!-- CONFIG — edit config.js to update the entire site -->
  <script src="config.js"></script>
  <script src="site.js"></script>
  <script type="module" src="sphere.js"></script>

  <script>
    (() => {
      const config = CONFIG;
      document.title = config.siteTitle;

      /* ── Hero ── */
      const hero = config.hero;
      const headlineEl = document.getElementById('hero-headline');
      headlineEl.textContent = hero.headline;
      if (hero.headlineLineHeight) headlineEl.style.lineHeight = hero.headlineLineHeight;
      document.getElementById('hero-subtext').textContent = hero.subtext;
      const dim = hero.dimOpacity ?? 0.4;
      document.getElementById('hero-overlay').style.background = `rgba(10,10,10,${dim})`;

      /* ── Work index ── */
      const projects = config.projects;
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('work-count').textContent = pad(projects.length);

      const list = document.getElementById('work-list');
      const preview = document.getElementById('work-preview');
      const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

      list.innerHTML = projects.map((p, i) => `
        <li>
          <a class="work-row" href="project.html?p=${p.slug}" data-i="${i}" style="--d:${i * 80}ms">
            ${p.thumb ? `<img class="work-thumb" src="${p.thumb}" alt="" loading="lazy">` : ''}
            <span class="work-num">${pad(i + 1)}</span>
            <span class="work-title">${p.title}</span>
            <span class="work-disc">${p.discipline}</span>
            <span class="work-cta">View project ${arrow}</span>
          </a>
        </li>`).join('');

      preview.innerHTML = projects
        .map((p, i) => p.thumb ? `<img src="${p.thumb}" alt="" data-i="${i}"${i === 0 ? ' class="active"' : ''}>` : '')
        .join('');

      // Hovering a row crossfades the preview; leaving keeps the last one.
      list.querySelectorAll('.work-row').forEach(row => {
        const show = () => preview.querySelectorAll('img').forEach(img =>
          img.classList.toggle('active', img.dataset.i === row.dataset.i));
        row.addEventListener('mouseenter', show);
        row.addEventListener('focus', show);
      });

      /* ── Scroll: nav background ── */
      const nav = document.getElementById('nav');
      new IntersectionObserver(([e]) => {
        nav.classList.toggle('scrolled', !e.isIntersecting);
      }, { threshold: 0.8 }).observe(document.getElementById('hero'));

      /* ── Scroll: reveal the index ── */
      const work = document.getElementById('work');
      new IntersectionObserver(([e], obs) => {
        if (e.isIntersecting) { work.classList.add('visible'); obs.disconnect(); }
      }, { threshold: 0.1 }).observe(work);
    })();
  </script>
</body>
</html>
