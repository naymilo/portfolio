<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nenad M</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAV -->
  <nav class="nav scrolled" id="nav">
    <a href="index.html" class="nav-logo" id="nav-logo"></a>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <main class="project" id="project"></main>

  <!-- FOOTER -->
  <footer class="footer" id="footer"></footer>

  <script src="config.js"></script>
  <script src="site.js"></script>
  <script>
    (() => {
      const config = CONFIG;
      const projects = config.projects;
      const slug = new URLSearchParams(location.search).get('p');
      const i = projects.findIndex(p => p.slug === slug);
      if (i === -1) { location.replace('index.html#work'); return; }

      const p = projects[i];
      const next = projects[(i + 1) % projects.length];
      document.title = `${p.title} · ${config.siteTitle}`;

      const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
      const back = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`;
      const external = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>`;

      const media = (p.videos || []).map(v => `
        <div class="project-embed" style="aspect-ratio:${v.ratio || 16 / 9}">
          <iframe src="https://player.vimeo.com/video/${v.id}?title=0&byline=0&portrait=0&dnt=1"
            allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"
            title="${p.title}"></iframe>
        </div>`).join('');
      const still = !media && p.thumb
        ? `<div class="project-still"><img src="${p.thumb}" alt="${p.title}"></div>` : '';

      const link = p.url
        ? `<a class="project-link" href="${p.url}" target="_blank" rel="noopener">${p.urlLabel || 'Visit'} ${external}</a>` : '';

      // An image slot: the real image once `src` is set, otherwise a labelled placeholder.
      const figure = (img, extra = '') => img.vimeo
        ? `<figure class="cs-figure cs-video ${extra}" style="aspect-ratio:${img.ratio || 16 / 9}"><iframe src="https://player.vimeo.com/video/${img.vimeo}?title=0&byline=0&portrait=0&dnt=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="${p.title}"></iframe></figure>`
        : img.src
        ? `<figure class="cs-figure ${extra}${img.fill ? ' cs-fill' : ''}" style="aspect-ratio:${img.ratio || 16 / 10}"><img src="${img.src}" alt="${img.alt || img.label || ''}" loading="lazy"></figure>`
        : `<figure class="cs-figure cs-placeholder ${extra}" style="aspect-ratio:${img.ratio || 16 / 10}"><span>${img.label || 'Image'}</span></figure>`;

      const paragraphs = body => (body || []).map(t => `<p>${t}</p>`).join('');

      // A minimal audio player; without src it shows a quiet "coming soon" state.
      const play = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>`;
      const pause = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>`;
      const audioPlayer = a => `
        <div class="cs-audio${a.src ? '' : ' cs-audio-empty'}">
          <button class="cs-audio-btn" type="button" aria-label="Play" ${a.src ? '' : 'disabled'}>${play}</button>
          <div class="cs-audio-info">
            <span class="cs-audio-title">${a.title}</span>
            <div class="cs-audio-track"><div class="cs-audio-fill"></div></div>
          </div>
          <span class="cs-audio-time">${a.src ? '0:00' : (a.label || 'Coming soon')}</span>
          ${a.src ? `<audio preload="metadata" src="${a.src}"></audio>` : ''}
        </div>
        ${a.credit ? `<p class="cs-audio-credit">${a.credit}</p>` : ''}
        ${a.flow ? `<ol class="cs-flow" aria-label="How this clip was made">${a.flow.map((f, n) => `
          <li class="cs-flow-step">
            <span class="cs-flow-num">${String(n + 1).padStart(2, '0')}</span>
            <span class="cs-flow-title">${f.title}</span>
            <span class="cs-flow-tool">${f.tool}</span>
            <span class="cs-flow-detail">${f.detail}</span>
          </li>`).join('')}</ol>` : ''}`;

      let content;
      if (p.caseStudy) {
        const cs = p.caseStudy;
        content = `
          <header class="project-header">
            <h1 class="project-title">${p.title}</h1>
            <p class="project-summary">${p.summary}</p>
            ${link}
          </header>

          ${cs.hero ? figure(cs.hero, 'cs-hero') : ''}

          ${cs.sections.map(sec => `
            <section class="cs-section">
              <h2 class="cs-label">${sec.label}</h2>
              <div class="cs-body">
                ${paragraphs(sec.body)}
                ${sec.features ? `<div class="cs-features${sec.features.length === 3 ? ' cs-features-3' : ''}">${sec.features.map(f => `
                  <div class="cs-feature${f.images ? ' cs-feature-wide' : ''}">
                    ${f.image ? figure(f.image) : ''}
                    ${f.images ? `<div class="cs-pair">${f.images.map(img => figure(img)).join('')}</div>` : ''}
                    <h3>${f.title}</h3>
                    <p>${f.body}</p>
                  </div>`).join('')}</div>` : ''}
                ${sec.gallery ? `<div class="cs-gallery">${sec.gallery.map(g => figure({ ratio: 4 / 3, ...g })).join('')}</div>` : ''}
                ${sec.audio ? audioPlayer(sec.audio) : ''}
              </div>
            </section>`).join('')}
        `;
      } else {
        content = `
          <header class="project-header">
            <h1 class="project-title">${p.title}</h1>
            <p class="project-summary">${p.summary}</p>
            <dl class="project-meta">
              <div><dt>Discipline</dt><dd>${p.discipline}</dd></div>
              ${p.tags && p.tags.length ? `<div><dt>Tools</dt><dd>${p.tags.join(', ')}</dd></div>` : ''}
            </dl>
            ${link}
          </header>

          <div class="project-media">${media}${still}</div>
        `;
      }

      document.getElementById('project').innerHTML = `
        <a href="index.html#work" class="project-back">${back} All work</a>
        ${content}

        <a class="project-next" href="project.html?p=${next.slug}">
          <span class="project-next-label">Next project</span>
          <span class="project-next-title">${next.title} ${arrow}</span>
        </a>
      `;

      const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
      document.querySelectorAll('.cs-audio').forEach(el => {
        const audio = el.querySelector('audio');
        if (!audio) return;
        const btn = el.querySelector('.cs-audio-btn');
        const fill = el.querySelector('.cs-audio-fill');
        const time = el.querySelector('.cs-audio-time');
        btn.addEventListener('click', () => (audio.paused ? audio.play() : audio.pause()));
        audio.addEventListener('play', () => { btn.innerHTML = pause; btn.setAttribute('aria-label', 'Pause'); });
        audio.addEventListener('pause', () => { btn.innerHTML = play; btn.setAttribute('aria-label', 'Play'); });
        audio.addEventListener('loadedmetadata', () => { time.textContent = fmt(audio.duration); });
        audio.addEventListener('timeupdate', () => {
          fill.style.width = `${(audio.currentTime / audio.duration) * 100 || 0}%`;
          time.textContent = fmt(audio.duration - audio.currentTime);
        });
        el.querySelector('.cs-audio-track').addEventListener('click', e => {
          const r = e.currentTarget.getBoundingClientRect();
          if (audio.duration) audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
        });
      });
    })();
  </script>
</body>
</html>
